(function(){
var KEY='crm-c2e-demo-v1', S, ui={view:'home',f:{},page:0,sel:{},open:null,imp:null,add:null,toast:null};
var $=function(s){return document.querySelector(s)};

function norm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim()}
function normPhone(p){if(p==null)return null;var s=String(p).replace(/[^0-9+]/g,'');if(!s)return null;if(s.indexOf('0033')===0)s='+'+s.slice(2);if(s.indexOf('+33')===0)return '0'+s.slice(3);if(s[0]==='+')return s;if(s.indexOf('33')===0&&s.length===11)return '0'+s.slice(2);return s}

var TZ='Europe/Paris';
function fD(i){return i?new Date(i.length<=10?i+'T12:00:00':i).toLocaleDateString('fr-FR',{timeZone:TZ}):'date inconnue'}
function fDT(i){return i?new Date(i).toLocaleString('fr-FR',{timeZone:TZ,dateStyle:'short',timeStyle:'short'}):''}
function now(){return new Date().toISOString()}
function day(n){var d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
var STAGES={recu:'Reçu',a_contacter:'À contacter',contact_etabli:'Contact établi',rdv_pris:'RDV pris',devis_a_faire:'Devis à faire',devis_realise:'Devis réalisé',vente_faite:'Vente faite',cloture_sans_vente:'Clôturé sans vente'};
var RESULTS={pas_de_reponse:'Pas de réponse',a_rappeler:'À rappeler',pas_interesse:'Pas intéressé',trop_loin:'Trop loin',injoignable:'Injoignable',faux_numero:'Faux numéro',trop_tard:'Trop tard',emploi_formation:'Demande emploi ou formation',autre:'Autre'};
var QUAL={a_verifier:'À vérifier',valide:'Validé',doublon:'Doublon',spam:'Spam confirmé'};
var CLOSE_REASONS=['pas_interesse','trop_loin','faux_numero','injoignable','trop_tard','emploi_formation','autre'];
function stagePill(r){var c={recu:'mu',a_contacter:'info',contact_etabli:'info',rdv_pris:'warn',devis_a_faire:'warn',devis_realise:'warn',vente_faite:'ok',cloture_sans_vente:'mu'}[r.stage];return '<span class="pill '+c+'">'+STAGES[r.stage]+'</span>'}
function qualPill(r){if(r.quality==='valide')return '';var c=r.quality==='a_verifier'?'warn':'bad';return ' <span class="pill '+c+'">'+QUAL[r.quality]+'</span>'}

/* ---------- Données ---------- */
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function seed(){
  S={nid:1,users:[
    {id:'u1',name:'Direction (démo)',role:'admin',active:true},{id:'u2',name:'Secrétariat (démo)',role:'secretariat',active:true},
    {id:'u3',name:'Camille Rivière',role:'commercial',active:true,tel:'06 00 00 00 03'},{id:'u4',name:'Nadir Costa',role:'commercial',active:true,tel:'06 00 00 00 04'},{id:'u5',name:'Inès Morel',role:'commercial',active:true,tel:'06 00 00 00 05'}],
    sources:['Formulaire estimation de votre projet sur le site','Leads Dualsun','Contact téléphonique RECOMMANDATION','Formulaire climatisation Occitanie','Formulaire Aide Toulouse Métropole','Contact Mail','Formulaire installation pompes à chaleur sur le site','Lead Facebook','Formulaire panneaux photovoltaïques Occitanie','Formulaire entretien sur le site','Formulaire panneaux solaires Occitanie','Téléphone Google','Pages Jaunes','Habitat Presto','Presencity','Kolink','Effy Pro','Campagne batterie','Leadcall','SolarEdge'],
    works:['Photovoltaïque','Rénovation globale','Isolation','Ballon thermodynamique','PAC air/eau','Ballon solaire','VMC','Batterie photovoltaïque','Chauffe-eau électrique','PAC air/air'],
    reqs:[],ev:[],tasks:[],mails:[],batches:[],audit:[],notifs:[],
    set:{autoMail:false,mailConfigured:false,alertH:24,subject:'Votre demande de travaux',body:'Bonjour {prenom_ou_nom},\n\nNous revenons vers vous au sujet de votre demande{projet}. Nous avons essayé de vous joindre par téléphone.\nVous pouvez répondre à ce message en nous indiquant un créneau pour vous rappeler.\n\nCordialement,\n{commercial}\n{tel_commercial}\n{entreprise}',company:'C2e'},me:'u2'};
  var N=['Durand','Lefèvre','Garcia','Petit','Roux','Fournier','Girard','Bonnet','Dupuis','Lambert','Fontaine','Rousseau','Vincent','Muller','Faure','Andre','Mercier','Blanc','Guerin','Boyer','Garnier','Chevalier','Francois','Legrand','Gauthier','Perrin','Robin','Clement','Morin','Nicolas','Henry','Roussel','Mathieu','Gautier','Masson','Marchand','Duval','Denis','Dumont','Marie'];
  var C=['Toulouse','Blagnac','Tournefeuille','Colomiers','Balma','Muret','Ramonville','L\'Union','Cugnaux','Saint-Orens'];
  for(var i=0;i<N.length;i++){
    var src=S.sources[i%12<10?(i*7)%S.sources.length%11:0];
    var w=[S.works[(i*3)%10]];
    var r=mk({name:N[i],phone:'06 '+(10+i)+' 2'+(i%10)+' 4'+(i%7)+' 5'+(i%9),email:i%5===0?'':N[i].toLowerCase().replace(/[^a-z]/g,'')+'@exemple.test',city:C[i%10],cp:'31'+('000'+(i*13%900)).slice(-3),source:src,works:w,receivedOn:day(-(40-i)),quality:i%13===12?'doublon':'valide'});
    var by=S.users[2+(i%3)];
    if(i<30&&r.quality==='valide'){assign(r.id,by.id,'u2',day(-(39-i))+'T09:00:00Z',true);
      var k=i%8;
      if(k===0){noAns(r.id,by.id,day(-(37-i))+'T10:00:00Z');}
      if(k===1){noAns(r.id,by.id,day(-(37-i))+'T10:00:00Z');noAns(r.id,by.id,day(-(36-i))+'T10:00:00Z');}
      if(k===2){noAns(r.id,by.id,day(-(37-i))+'T10:00:00Z');noAns(r.id,by.id,day(-(36-i))+'T10:00:00Z');noAns(r.id,by.id,day(-(35-i))+'T10:00:00Z');}
      if(k===3){contact(r.id,by.id,day(-(36-i))+'T11:00:00Z');rdv(r.id,by.id,day(-(30-i)),'14:00',day(-(36-i))+'T11:05:00Z');}
      if(k===4){contact(r.id,by.id,day(-(36-i))+'T11:00:00Z');rdv(r.id,by.id,day(-(32-i)),'10:00',day(-(36-i))+'T11:05:00Z');devis(r.id,by.id,day(-(30-i))+'T16:00:00Z');}
      if(k===5){contact(r.id,by.id,day(-(36-i))+'T11:00:00Z');rdv(r.id,by.id,day(-(33-i)),null,day(-(36-i))+'T11:05:00Z');devis(r.id,by.id,day(-(31-i))+'T16:00:00Z');vente(r.id,by.id,day(-(20-i)),i%2?12400:null,'TTC',day(-(20-i))+'T10:00:00Z');}
      if(k===6){contact(r.id,by.id,day(-(36-i))+'T11:00:00Z');closeR(r.id,by.id,'trop_loin','',day(-(35-i))+'T09:00:00Z');}
    }
  }
  S.reqs.forEach(function(r,i){if(r.stage==='recu'&&r.quality==='valide'&&i>=30){}});
  S.reqs.push(mk({name:'',phone:'',email:'',city:'',source:'Formulaire estimation de votre projet sur le site',works:[],receivedOn:day(-1),quality:'a_verifier',desc:'Demande à vérifier : tous les choix cochés, identité vide.'}));
  S.reqs[S.reqs.length-1].alerts=['Demande à vérifier'];
  S.notifs=[];save();
}
function mk(o){var r={id:S.nid++,name:o.name||'',phone:o.phone||'',email:o.email||'',city:o.city||'',cp:o.cp||'',address:o.address||'',source:o.source||'',sourceOrig:o.sourceOrig||o.source||'',works:o.works||[],desc:o.desc||'',budget:o.budget||'',campaign:o.campaign||'',avail:o.avail||'',raw:o.raw||'',receivedOn:o.receivedOn===undefined?day(0):o.receivedOn,quality:o.quality||'a_verifier',stage:'recu',lastResult:null,assignedTo:null,assignedAt:null,closeReason:'',optOut:false,version:1,dupOf:o.dupOf||null,histNote:o.histNote||'',histCalls:o.histCalls||null,alerts:o.alerts||[],batch:o.batch||null,createdAt:o.createdAt||now(),sale:null,devisRef:''};S.reqs.push(r);return r}
function R(id){return S.reqs.filter(function(r){return r.id===id})[0]}
function U(id){return S.users.filter(function(u){return u.id===id})[0]}
function me(){return U(S.me)}
function canSee(r){var m=me();return m.role!=='commercial'||r.assignedTo===m.id}
function logE(rid,type,by,at,note,data){S.ev.push({id:S.nid++,rid:rid,type:type,by:by,at:at||now(),note:note||'',data:data||{}})}
function evs(rid){return S.ev.filter(function(e){return e.rid===rid}).sort(function(a,b){return a.at<b.at?-1:1})}
function assign(rid,to,by,at,quiet){var r=R(rid),from=r.assignedTo;r.assignedTo=to;r.assignedAt=at||now();r.version++;if(r.stage==='recu')r.stage='a_contacter';logE(rid,'assign',by,at,'',{from:from,to:to});
  S.tasks.forEach(function(t){if(t.rid===rid&&t.status==='open'&&t.kind==='appeler')t.status='cancelled'});
  S.tasks.push({id:S.nid++,rid:rid,kind:'appeler',due:new Date(new Date(r.assignedAt).getTime()+S.set.alertH*3600e3).toISOString(),status:'open'});
  if(!quiet)S.notifs.push({id:S.nid++,to:to,rid:rid,at:now(),txt:'Nouveau dossier attribué : '+(r.name||'(sans nom)'),seen:false})}
function streak(rid){var last=0,n=0;evs(rid).forEach(function(e){if(e.type==='contact'){n=0;last=e.id}else if(e.type==='noanswer')n++});return{n:n,seq:last}}
function openTasks(rid,kind){return S.tasks.filter(function(t){return t.rid===rid&&t.status==='open'&&(!kind||t.kind===kind)})}
function cancelTasks(rid,kinds){S.tasks.forEach(function(t){if(t.rid===rid&&t.status==='open'&&(!kinds||kinds.indexOf(t.kind)>-1))t.status='cancelled'})}
function noAns(rid,by,at,note){var r=R(rid);logE(rid,'noanswer',by,at,note);r.lastResult='pas_de_reponse';r.version++;cancelTasks(rid,['appeler','rappeler']);var s=streak(rid);
  if(s.n>=3){var key=rid+':'+s.seq;if(!S.tasks.some(function(t){return t.key===key})){S.tasks.push({id:S.nid++,rid:rid,kind:'mail',due:at||now(),status:'open',key:key})}}
  else S.tasks.push({id:S.nid++,rid:rid,kind:'rappeler',due:new Date(new Date(at||now()).getTime()+864e5).toISOString(),status:'open'});return s.n}
function contact(rid,by,at,note){var r=R(rid);logE(rid,'contact',by,at,note);r.lastResult=null;r.version++;cancelTasks(rid,['mail','appeler','rappeler']);if(r.stage==='recu'||r.stage==='a_contacter')r.stage='contact_etabli'}
function callback(rid,by,due,note){var r=R(rid);logE(rid,'callback',by,null,note,{due:due});r.lastResult='a_rappeler';r.version++;cancelTasks(rid,['appeler','rappeler']);S.tasks.push({id:S.nid++,rid:rid,kind:'rappeler',due:due,status:'open'})}
function rdv(rid,by,date,time,at,note){var r=R(rid);logE(rid,'rdv',by,at,note,{date:date,time:time||''});r.rdvDate=date;r.rdvTime=time;r.version++;cancelTasks(rid,['mail','appeler','rappeler']);if(['recu','a_contacter','contact_etabli'].indexOf(r.stage)>-1)r.stage='rdv_pris'}
function devis(rid,by,at,ref){var r=R(rid);logE(rid,'devis',by,at,ref||'');r.devisRef=ref||'';r.version++;if(r.stage!=='vente_faite')r.stage='devis_realise'}
function vente(rid,by,date,amount,ttc,at){var r=R(rid);logE(rid,'vente',by,at,'',{date:date,amount:amount,ttc:ttc});r.sale={date:date,amount:amount,ttc:ttc};r.stage='vente_faite';r.version++;cancelTasks(rid)}
function closeR(rid,by,reason,note,at){var r=R(rid);logE(rid,'close',by,at,note,{reason:reason});r.stage='cloture_sans_vente';r.closeReason=reason;r.lastResult=reason;r.version++;cancelTasks(rid)}
function mailBlock(r){if(r.stage==='cloture_sans_vente')return 'Dossier clôturé';if(r.quality==='doublon'||r.quality==='spam')return 'Dossier marqué doublon ou spam';if(r.optOut)return 'Opposition au contact enregistrée';if(['rdv_pris','devis_a_faire','devis_realise','vente_faite'].indexOf(r.stage)>-1)return 'Un rendez-vous a été pris';if(!validMail(normMail(r.email)))return 'Email manquant ou à corriger';return ''}
function renderMail(r){var cm=U(r.assignedTo)||{name:'',tel:''},s=S.set,fn=r.name||'';
  var body=s.body.replace(/\{prenom_ou_nom\}/g,fn||'').replace(/\{projet\}/g,r.works.length?' ('+r.works.join(', ').toLowerCase()+')':'').replace(/\{commercial\}/g,cm.name||'').replace(/\{tel_commercial\}/g,cm.tel||'').replace(/\{entreprise\}/g,s.company||'');
  body=body.replace(/Bonjour ,/,'Bonjour,').replace(/\n{3,}/g,'\n\n').replace(/\{[a-z_]+\}/g,'');return{subject:s.subject.replace(/\{[a-z_]+\}/g,''),body:body}}
function isLate(t){return t.status==='open'&&t.kind!=='mail'&&t.due<now()}
function unassigned(r){var u=r.assignedTo&&U(r.assignedTo);return !r.archived&&r.stage!=='cloture_sans_vente'&&r.stage!=='vente_faite'&&r.quality!=='doublon'&&r.quality!=='spam'&&(!r.assignedTo||(u&&!u.active))}
function untreated(r){return r.assignedTo&&!r.archived&&r.quality!=='doublon'&&r.quality!=='spam'&&r.stage==='a_contacter'&&!evs(r.id).some(function(e){return ['noanswer','contact'].indexOf(e.type)>-1})}

  var nb=S.notifs.filter(function(n){return n.to===m.id&&!n.seen}).length;$('#bell').textContent='🔔 '+nb;$('#bell').style.cssText='background:#ffffff14;color:inherit;border-color:#ffffff33';

function render(){
  var m=me();if(!m.active){$('#app').innerHTML='<div class="card msg bad">Ce compte est désactivé : accès bloqué immédiatement. L\'historique est conservé.</div>';renderTop();return}
  if(tabsFor(m).map(function(t){return t[0]}).indexOf(ui.view)<0)ui.view='home';renderTop();
  var v={home:vHome,contacts:vContacts,add:vAdd,assign:vAssign,stats:vStats,settings:vSettings,about:vAbout}[ui.view];
  $('#app').innerHTML=(ui.toast?'<div class="msg '+ui.toast.k+'" role="status">'+esc(ui.toast.t)+'</div>':'')+v();ui.toast=null;

function counterBtn(n,label,f){return '<button class="cnt" data-act="goto" data-f=\''+esc(JSON.stringify(f))+'\'><b>'+n+'</b><span>'+label+'</span></button>'}

/* ---------- Accueil ---------- */
function vHome(){var m=me();if(m.role==='commercial')return vHomeCom(m);
  var all=S.reqs.filter(function(r){return !r.archived}),f=function(fn){return all.filter(fn).map(function(r){return r.id})};
  var rec=f(function(r){return r.received!==0&&(r.receivedOn||'')>=day(-30)}),un=f(unassigned),ver=f(function(r){return r.quality==='a_verifier'}),nt=f(untreated),late=S.tasks.filter(isLate).filter(function(t){return !R(t.rid).archived&&R(t.rid).stage!=='cloture_sans_vente'}).map(function(t){return t.rid});
  var rea=S.reqs.filter(function(r){var u=r.assignedTo&&U(r.assignedTo);return u&&!u.active&&r.stage!=='cloture_sans_vente'&&r.stage!=='vente_faite'}).length;
  return '<h2>Accueil</h2><div class="grid">'+counterBtn(rec.length,'Contacts reçus (30 jours)',{ids:rec})+counterBtn(un.length,'Non attribués',{ids:un})+counterBtn(ver.length,'À vérifier',{ids:ver})+counterBtn(nt.length,'Non traités',{ids:nt})+counterBtn(late.length,'Actions en retard',{ids:late})+'</div>'+
  (rea?'<div class="msg warn">'+rea+' dossier(s) appartiennent à un commercial désactivé : à réattribuer dans l\'onglet Attribution.</div>':'')+
  '<div class="card"><h3>Ce que vous pouvez essayer</h3><ol><li>Onglet <b>Ajouter</b> : collez l\'un des trois mails d\'exemple et regardez l\'extraction.</li><li>Onglet <b>Attribution</b> : donnez des dossiers à un commercial.</li><li>Changez de personne en haut (par exemple Camille Rivière) : le commercial ne voit que ses dossiers. Faites trois « Appel sans réponse » pour voir apparaître l\'action mail.</li></ol></div>'}
function listCard(title,rows,empty){return '<div class="card"><h3>'+title+' <span class="pill mu">'+rows.length+'</span></h3>'+(rows.length?'<div class="tw"><table><tbody>'+rows.map(function(r){return '<tr class="click" data-act="open" data-id="'+r.id+'"><td><b>'+esc(r.name||'(sans nom)')+'</b><br><span class="muted small">'+esc(r.city)+' · '+esc(r.works.join(', '))+'</span></td><td>'+stagePill(r)+'</td><td class="small">'+esc(r.hint||'')+'</td></tr>'}).join('')+'</tbody></table></div>':'<p class="muted">'+empty+'</p>')+'</div>'}
function vHomeCom(m){var mine=S.reqs.filter(function(r){return r.assignedTo===m.id&&!r.archived}),nowI=now(),n=function(r,h){r.hint=h;return r};
  var news=mine.filter(untreated).map(function(r){return n(r,'Attribué le '+fD(r.assignedAt))});
  var today=[],late=[];S.tasks.forEach(function(t){var r=R(t.rid);if(r.assignedTo!==m.id||t.status!=='open'||t.kind==='mail')return;if(t.due<nowI)late.push(n(r,'Échéance '+fDT(t.due)));else if(t.due.slice(0,10)===day(0))today.push(n(r,'Aujourd\'hui '+fDT(t.due)))});
  var rd=mine.filter(function(r){return r.stage==='rdv_pris'}).map(function(r){return n(r,'RDV '+fD(r.rdvDate)+' '+(r.rdvTime||'(heure à préciser)'))}),dv=mine.filter(function(r){return r.stage==='devis_a_faire'||r.stage==='rdv_pris'&&r.rdvDate<=day(0)}).map(function(r){return n(r,'Devis à faire')});
  var mails=S.tasks.filter(function(t){return t.kind==='mail'&&t.status==='open'&&R(t.rid).assignedTo===m.id}).map(function(t){return n(R(t.rid),'✉️ Envoyer mail (3 appels sans réponse)')});
  var nt=S.notifs.filter(function(x){return x.to===m.id}).slice(-3).reverse();
  return '<h2>Bonjour '+esc(m.name.split(' ')[0])+'</h2>'+
  '<div class="card"><form id="tryurl" class="row"><label>Tester l\'isolation : ouvrir le dossier n°<input id="tryid" type="number" min="1" style="width:110px"></label><button class="p">Ouvrir</button></form><p class="muted small" style="margin:6px 0 0">Un numéro qui ne vous appartient pas est refusé, comme avec une adresse modifiée à la main.</p></div>'+
  (nt.length?'<div class="msg info">'+nt.map(function(x){return esc(x.txt)+' ('+fDT(x.at)+')'}).join('<br>')+'</div>':'')+
  (mails.length?listCard('Relances par mail à envoyer',mails,''):'')+listCard('Mes nouveaux contacts',news,'Aucun nouveau contact.')+listCard('À rappeler aujourd\'hui',today,'Rien à rappeler aujourd\'hui.')+listCard('En retard',late,'Aucun retard.')+listCard('Mes rendez-vous',rd,'Aucun rendez-vous.')+listCard('Mes devis à faire',dv,'Aucun devis à faire.')}

function filtered(){var f=ui.f,m=me(),q=norm(f.q);return S.reqs.filter(function(r){if(!canSee(r)||r.archived&&!f.arch)return false;
  if(f.ids&&f.ids.indexOf(r.id)<0)return false;if(f.source&&r.source!==f.source)return false;if(f.stage&&r.stage!==f.stage)return false;
  if(f.com&&(f.com==='-'?r.assignedTo:r.assignedTo!==f.com))return false;if(f.work&&r.works.indexOf(f.work)<0)return false;
  if(q){var hay=norm(r.name+' '+r.email+' '+r.city)+' '+(normPhone(r.phone)||'');var qp=normPhone(f.q);if(hay.indexOf(q)<0&&!(qp&&qp.length>3&&hay.indexOf(qp)>-1))return false}return true}).sort(function(a,b){return b.id-a.id})}

function lastContact(r){var e=evs(r.id).filter(function(x){return ['noanswer','contact','rdv','devis','vente'].indexOf(x.type)>-1});return e.length?fD(e[e.length-1].at):'—'}

  (sl.map(function(r){var t=openTasks(r.id)[0];var u=r.assignedTo&&U(r.assignedTo);return '<tr class="click" data-act="open" data-id="'+r.id+'"><td><b>'+esc(r.name||'(sans nom)')+'</b>'+qualPill(r)+'</td><td>'+esc(r.city)+'</td><td class="small">'+esc(r.source)+'</td><td class="small">'+esc(r.works.join(', '))+'</td><td>'+(u?esc(u.name)+(u.active?'':' <span class="pill bad">désactivé</span>'):'<span class="pill warn">Non attribué</span>')+'</td><td>'+stagePill(r)+'</td><td>'+lastContact(r)+'</td><td class="small">'+(t?({appeler:'Appeler',rappeler:'Rappeler',mail:'Envoyer mail'}[t.kind])+' · '+fD(t.due):'—')+'</td></tr>'}).join('')||'<tr><td colspan="8" class="muted">Aucun dossier ne correspond.</td></tr>')+'</tbody></table></div>'+
  '<div class="row sp" style="margin-top:8px"><span class="muted small">'+rows.length+' dossier(s) · page '+(ui.page+1)+'/'+pages+'</span><span class="row"><button data-act="pg" data-d="-1"'+(ui.page?'':' disabled')+'>Précédent</button><button data-act="pg" data-d="1"'+(ui.page<pages-1?'':' disabled')+'>Suivant</button></span></div>'}
function csvCell(v){v=String(v==null?'':v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}

  var out=h.map(csvCell).join(';')+'\n'+rows.map(function(r){var u=U(r.assignedTo);return [r.name,r.phone,r.email,r.city,r.source,r.works.join(' / '),u?u.name:'',STAGES[r.stage],QUAL[r.quality]].map(csvCell).join(';')}).join('\n');

  $('#exp').innerHTML='<div class="card" style="margin-top:12px"><h3>Export CSV ('+rows.length+' lignes, généré le '+fDT(now())+')</h3><p class="muted small">Dans ce prototype, le téléchargement de fichier est bloqué : copiez le texte. Les cellules commençant par = + - @ sont protégées contre l\'interprétation comme formule. L\'export est journalisé.</p><textarea id="csvt" readonly>'+esc(out)+'</textarea><button data-act="copycsv">Copier</button></div>'}

    rq4.name=$('#e_name').value.trim();rq4.phone=$('#e_phone').value.trim();rq4.email=$('#e_email').value.trim();rq4.city=$('#e_city').value.trim();rq4.version++;logE(id,'edit',m.id);ui.toast={t:'Coordonnées enregistrées.',k:'ok'};render()}
  else if(a==='fakecolleague'){var rq5=R(id);rq5.version++;ui.toast={t:'Un collègue vient de modifier ce dossier (simulation). Si vous enregistrez avec l\'ancienne version, vous verrez le message de conflit.',k:'info'};ui.keepV=true;renderModal();$('#app').insertAdjacentHTML('afterbegin','<div class="msg info">Un collègue vient de modifier ce dossier (simulation). Enregistrez maintenant pour voir le conflit.</div>')}
  else if(a==='addmode'){ui.add={mode:t.getAttribute('data-m'),txt:'',res:null};render()}
  else if(a==='sample'){ui.add.txt=SAMPLES[t.getAttribute('data-k')];ui.add.res=parseMail(ui.add.txt);render()}
  else if(a==='parse'){ui.add.txt=$('#paste').value;ui.add.res=parseMail(ui.add.txt);render()}
  else if(a==='usefix'){ui.add.res.fields.email=ui.add.res.fields.mailSuggest;ui.add.res.fields.mailSuggest='';render()}
  else if(a==='create'){createFromPreview({dup:+t.getAttribute('data-dup')||0,sep:t.getAttribute('data-sep'),markdup:+t.getAttribute('data-markdup')||0})}
  else if(a==='impsample'){var rows=sampleSheet();ui.imp={fname:'classeur-exemple-fictif.xlsx',sheets:['CONTACTS'],sheet:'CONTACTS',hash:'exemple-fictif-v1'};loadRows(ui.imp,rows);render()}
  else if(a==='doimport')runImport();
  else if(a==='doassign')doAssign();
  else if(a==='toggleu'){var u=U(id);u.active=!u.active;S.audit.push({at:now(),by:S.me,act:(u.active?'réactivation de ':'désactivation de ')+u.name});ui.toast={t:u.active?'Compte réactivé.':'Compte désactivé : accès bloqué, historique conservé, dossiers à réattribuer.',k:'ok'};render()}
  else if(a==='savesettings'){S.set.mailConfigured=$('#smc').checked;S.set.autoMail=S.set.mailConfigured&&$('#sma').checked;S.set.subject=$('#smsub').value;S.set.body=$('#smbody').value;S.set.alertH=+$('#smal').value||24;toast('Paramètres enregistrés.')}
  else if(a==='addsrc'){var v=$('#nsrc').value.trim();if(v&&S.sources.indexOf(v)<0)S.sources.push(v);render()}
  else if(a==='reset'){try{localStorage.removeItem(KEY)}catch(e){}seed();ui={view:'home',f:{},page:0,sel:{},open:null};render()}});
document.addEventListener('submit',function(e){if(e.target.id==='tryid'||e.target.id==='tryurl'){e.preventDefault();var n=+$('#tryid').value;if(n)openReq(n)}});
document.addEventListener('change',function(e){var t=e.target,id=t.id;
  if(id==='who'){S.me=t.value;ui.open=null;ui.view='home';ui.f={};ui.sel={};S.notifs.forEach(function(n){});render();return}
  if(id==='fs'||id==='fe'||id==='fw'||id==='fc'){ui.f[{fs:'source',fe:'stage',fw:'work',fc:'com'}[id]]=t.value;ui.page=0;fillTable();return}
  if(t.hasAttribute('data-sel')){ui.sel[t.getAttribute('data-sel')]=t.checked;render();return}
  if(t.hasAttribute('data-role')){var u=U(t.getAttribute('data-role'));if(me().role==='admin'){u.role=t.value;S.audit.push({at:now(),by:S.me,act:'rôle de '+u.name+' → '+t.value})}render();return}
  if(t.hasAttribute('data-map')){ui.imp.map[t.getAttribute('data-map')]=t.value;render();return}
  if(id==='sfrom'||id==='sto'){ui.sf[id==='sfrom'?'from':'to']=t.value;render();return}
  if(id==='smc'){S.set.mailConfigured=t.checked;if(!t.checked)S.set.autoMail=false;render();return}
  if(id==='isheet'){ui.imp.sheet=t.value;loadSheet(ui.imp);return}
  if(id==='ifile'){var fl=t.files[0];if(!fl)return;var rd=new FileReader();rd.onload=function(){var buf=rd.result;sha(buf).then(function(hash){var im=ui.imp={fname:fl.name,hash:hash};
    try{if(/\.csv$/i.test(fl.name)){var tx=new TextDecoder('utf-8').decode(buf);if(tx.indexOf('�')>-1)tx=new TextDecoder('windows-1252').decode(buf);im.sheets=['CSV'];im.sheet='CSV';loadRows(im,parseCSV(tx).filter(function(r){return r.join('').trim()}))}
    else{if(!window.XLSX)throw new Error('lecteur Excel indisponible');var wb=XLSX.read(buf,{type:'array',cellDates:true,raw:true});im.wb=wb;im.sheets=wb.SheetNames;im.sheet=wb.SheetNames.indexOf('CONTACTS')>-1?'CONTACTS':wb.SheetNames[0];loadSheet(im);return}}catch(err){ui.imp=null;toast('Fichier illisible : '+err.message+'. Aucun schéma fournisseur n\'est supposé : vérifiez le format.','bad');return}
    render()})};rd.readAsArrayBuffer(fl);return}});
function loadSheet(im){var aoa=XLSX.utils.sheet_to_json(im.wb.Sheets[im.sheet],{header:1,raw:true,defval:''});loadRows(im,aoa);render()}
document.addEventListener('input',function(e){if(e.target.id==='fq'){ui.f.q=e.target.value;ui.page=0;fillTable()}});
$('#bell').addEventListener('click',function(){S.notifs.forEach(function(n){if(n.to===S.me)n.seen=true});ui.view='home';render()});
try{var raw=localStorage.getItem(KEY);S=raw?JSON.parse(raw):null}catch(e){S=null}
if(!S||!S.reqs)seed();render();
})();
</script>
