<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>CRM C2e</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Refonte : barre latérale sur ordinateur, barre d'onglets en bas sur téléphone ; bleu profond + soleil, cartes sobres. */
:root{--bg:#f5f8f4;--card:#fff;--ink:#10201a;--muted:#5a6c62;--line:#dfe8e1;--accent:#62dd4a;--accent-ink:#0b1c11;--accent-d:#1a7f3b;--sun:#f6c642;--blue:#2a9fd6;--ok:#17713f;--okbg:#e2f6e3;--warn:#8a5600;--warnbg:#fff2cf;--bad:#b42318;--badbg:#fde4e1;--info:#17719e;--infobg:#e1f2fb;--head:#fff;--head-ink:#10201a;--tabhover:#eef7ea;--tabon:#e3f6dc;--shadow:0 1px 2px #10201a10,0 6px 18px #10201a0d;--hf:'Outfit','Plus Jakarta Sans',system-ui,sans-serif;--bf:'Public Sans',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1611;--card:#13241b;--ink:#e8f3ec;--muted:#9bb0a3;--line:#243a2e;--accent:#6be04f;--accent-ink:#06130a;--accent-d:#86ec70;--sun:#f6c642;--blue:#5cc0ee;--ok:#6fe3a1;--okbg:#12362a;--warn:#f2b85f;--warnbg:#3a2a0e;--bad:#ff9d94;--badbg:#401a17;--info:#8cd2f2;--infobg:#12303f;--head:#0a130e;--head-ink:#e8f3ec;--tabhover:#16281e;--tabon:#1b3326;--shadow:0 1px 2px #0006;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1611;--card:#13241b;--ink:#e8f3ec;--muted:#9bb0a3;--line:#243a2e;--accent:#6be04f;--accent-ink:#06130a;--accent-d:#86ec70;--sun:#f6c642;--blue:#5cc0ee;--ok:#6fe3a1;--okbg:#12362a;--warn:#f2b85f;--warnbg:#3a2a0e;--bad:#ff9d94;--badbg:#401a17;--info:#8cd2f2;--infobg:#12303f;--head:#0a130e;--head-ink:#e8f3ec;--tabhover:#16281e;--tabon:#1b3326;--shadow:0 1px 2px #0006;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--bf);margin:0;padding:0}
h1,h2,h3{font-family:var(--hf);margin:0;text-wrap:balance;letter-spacing:-.01em}h2{font-size:1.45rem;font-weight:700}h3{font-size:1.02rem;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px;min-height:42px;font-weight:600;transition:background .15s,border-color .15s,box-shadow .15s}
button:hover{border-color:var(--accent);box-shadow:0 0 0 3px #62dd4a2e}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);border-radius:999px;font-weight:700;letter-spacing:.01em;padding:9px 20px}button.p:hover{filter:brightness(1.06);box-shadow:0 4px 14px #62dd4a55}
button.danger{color:var(--bad);border-color:var(--bad);background:var(--card)}button:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:42px;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}textarea{width:100%;min-height:150px}
label{display:flex;flex-direction:column;gap:5px;font-size:.82rem;font-weight:600;color:var(--muted)}
a{color:var(--accent-d)}code{background:var(--bg);padding:2px 6px;border-radius:6px;font-size:.9em}
/* barre latérale / en-tête */
.top{background:var(--head);color:var(--head-ink);display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);box-shadow:0 1px 0 var(--line)}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;padding:14px 18px}
.logo{display:flex;align-items:center;gap:10px;font:700 1.12rem var(--hf);letter-spacing:.01em;color:var(--ink)}.logo svg{width:40px;height:40px;flex:none}.logo .lg1{color:var(--accent-d)}.logo small{display:block;font:600 .6rem var(--bf);letter-spacing:.24em;color:var(--muted);margin-top:3px;padding-top:3px;border-top:2px solid var(--accent)}
.who{display:flex;flex-direction:column;gap:2px;font-size:.82rem;min-width:0}.who b{font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.who span{opacity:.7}
.top #out{background:transparent;color:var(--muted);border-color:var(--line);min-height:36px;font-size:.82rem;border-radius:999px}.top #out:hover{border-color:var(--accent);box-shadow:none;color:var(--ink)}
.tabs{display:flex;gap:4px;padding:0 10px 10px}
.tabs button{display:flex;align-items:center;gap:10px;background:transparent;border:0;border-radius:10px;color:var(--head-ink);opacity:.9;padding:10px 12px;min-height:44px;font-weight:600;text-align:left;box-shadow:none}
.tabs button svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button:hover{background:var(--tabhover);opacity:1;box-shadow:none;border-color:transparent}.tabs button.on{background:var(--tabon);opacity:1;box-shadow:inset 4px 0 0 var(--accent);color:var(--ink)}
main{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding:22px 18px 40px}
.demo{background:var(--warnbg);color:var(--warn);padding:6px 12px;border-radius:8px;font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0;box-shadow:var(--shadow)}
.card>h3{margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.cnt{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.cnt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--accent),var(--blue))}
.cnt b{font:800 2.1rem var(--hf);font-variant-numeric:tabular-nums;color:var(--ink)}.cnt span{color:var(--muted);font-size:.85rem;font-weight:500}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.sp{justify-content:space-between;align-items:center}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.88rem}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--bg);white-space:nowrap;font-weight:700}
tbody tr:last-child td{border-bottom:0}tr.click{cursor:pointer}tr.click:hover td{background:var(--tabhover)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.74rem;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.info{background:var(--infobg);color:var(--info)}.pill.mu{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.panel{position:fixed;inset:0;background:#0a160ea6;z-index:40;display:flex;justify-content:flex-end;backdrop-filter:blur(2px)}
.sheet{background:var(--bg);width:min(660px,100%);height:100%;overflow:auto;padding:16px 18px 40px;display:flex;flex-direction:column;gap:12px;box-shadow:-12px 0 40px #0006}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.acts button{min-height:52px}
.tl{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}.tl li{border-left:3px solid var(--line);padding:2px 12px;font-size:.88rem}.tl small{color:var(--muted)}
.msg{padding:11px 14px;border-radius:10px;border:1px solid transparent}.msg.ok{background:var(--okbg);color:var(--ok)}.msg.warn{background:var(--warnbg);color:var(--warn)}.msg.bad{background:var(--badbg);color:var(--bad)}.msg.info{background:var(--infobg);color:var(--info)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:760px){.two{grid-template-columns:1fr}}
pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0;font-size:.82rem;max-height:340px;overflow:auto}
mark{background:var(--warnbg);color:var(--warn);padding:0 3px;border-radius:3px}.muted{color:var(--muted)}.small{font-size:.82rem}
.callbig{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;border-radius:12px;background:var(--ok);color:#fff;font:700 1.1rem var(--bf);text-decoration:none;margin-bottom:12px}
.callbtn{display:inline-flex;align-items:center;justify-content:center;min-width:48px;min-height:48px;border-radius:50%;background:var(--okbg);color:var(--ok);text-decoration:none;font-size:1.3rem}
.dlgbg{position:fixed;inset:0;background:#0a160ea6;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px #0008}.dlg p{margin:0}
/* connexion */
.loginwrap{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.brand{background:linear-gradient(160deg,#f1fbec,#def1fb);color:var(--ink);padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:24px;position:relative;overflow:hidden}
.brand::after{content:"";position:absolute;right:-110px;bottom:-110px;width:360px;height:360px;border-radius:50%;border:34px solid transparent;background:linear-gradient(#f1fbec,#f1fbec) padding-box,linear-gradient(135deg,#62dd4a,#2a9fd6) border-box;opacity:.55}
.brand>*{position:relative;z-index:1}
.brand h1{font-size:2.3rem;line-height:1.1;max-width:15ch;font-weight:600}.brand h1 em{font-style:normal;color:var(--accent-d)}.brand p{color:var(--muted);max-width:40ch;margin:12px 0 0}
.brand .logo{font-size:1.2rem}
.login{max-width:400px;width:100%;margin:auto;display:flex;flex-direction:column;gap:14px;padding:28px}
.loginside{display:flex;padding:24px}
@media(max-width:860px){.loginwrap{grid-template-columns:1fr}.brand{padding:28px 22px}.brand h1{font-size:1.5rem}}
/* ordinateur : barre latérale */
@media(min-width:961px){
  body.in{padding-left:250px}
  body.in .top{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:20;overflow:auto}
  body.in .bar{flex-direction:column;align-items:stretch;gap:16px;padding:20px 16px 12px}
  body.in .bar>.row{flex-direction:column;align-items:stretch!important;gap:10px}
  body.in .tabs{flex-direction:column;flex:1}
  .panel{z-index:50}
}
/* téléphone */
@media(max-width:960px){
  body.in{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .top{position:static}
  .bar{padding:12px 16px}
  .who{display:none}
  .tabs{position:fixed;left:0;right:0;bottom:0;background:var(--head);border-top:1px solid var(--line);box-shadow:0 -4px 16px #10201a12;padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));z-index:30;justify-content:space-around;gap:2px}
  .tabs button{flex:1;flex-direction:column;gap:3px;justify-content:center;align-items:center;text-align:center;min-height:58px;font-size:.7rem;padding:6px 2px;line-height:1.15;border-radius:10px}
  .tabs button.on{box-shadow:inset 0 3px 0 var(--accent)}
  main{padding:16px 14px 24px}
}
@media(max-width:600px){
  body{font-size:16px}
  input,select,textarea{font-size:16px;min-height:48px}
  button{min-height:48px}
  h2{font-size:1.25rem}
  .panel{z-index:55}
  .hd{position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:2;flex-wrap:nowrap!important}.hd>*{flex:0 1 auto!important}.hd h2{font-size:1.1rem}
  .grid{grid-template-columns:repeat(2,1fr)}.cnt b{font-size:1.8rem}
  .row>label,.row>button{flex:1 1 100%}
  .row.dates>label{flex:1 1 44%}
  .top .row>*{flex:0 1 auto!important}.top #out{min-height:40px}
  .sheet{width:100%;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
  .acts{grid-template-columns:1fr 1fr}.acts button{min-height:64px;font-size:1rem;padding:6px}.acts button.wide{grid-column:1/-1}
  table.rt thead{display:none}
  table.rt,table.rt tbody,table.rt tr,table.rt td{display:block;width:100%}
  table.rt tr{padding:12px 14px;border-bottom:1px solid var(--line);position:relative}
  table.rt td{border:0;padding:2px 0}table.rt td.hm{display:none}
  table.rt td.call{position:absolute;right:10px;top:10px;width:auto}table.rt td.pr{padding-right:58px}
}

@media(max-width:600px){
  body{font-size:15px}
  main{padding:10px 10px 18px;gap:10px}#app{gap:10px}
  .bar{padding:6px 12px;gap:8px;flex-wrap:nowrap}
  .logo{font-size:.95rem}.logo svg{width:30px;height:30px}.logo small{font-size:.5rem;margin-top:1px;padding-top:2px}
  .top #out{min-height:34px;font-size:.78rem;padding:4px 12px}
  h2{font-size:1.1rem}
  .card{padding:12px;border-radius:12px}.card>h3{margin-bottom:6px;font-size:.98rem}
  .grid{gap:8px}.cnt{padding:10px 12px;border-radius:12px}.cnt b{font-size:1.55rem}.cnt span{font-size:.78rem}.cnt a{color:var(--muted);text-decoration:none}
  label{font-size:.76rem;gap:3px}
  input,select,textarea{min-height:46px;padding:8px 12px;border-radius:10px}
  .tabs{padding-top:2px}.tabs button{min-height:52px;font-size:.68rem}.tabs button svg{width:22px;height:22px}
  body.in{padding-bottom:calc(60px + env(safe-area-inset-bottom,0px))}
  .flt{display:flex;flex-direction:column;gap:8px}.flt summary{min-height:42px;display:flex;align-items:center;font-weight:700;cursor:pointer;color:var(--accent-d);list-style:none}.flt summary::-webkit-details-marker{display:none}.flt summary::after{content:"▾";margin-left:8px}
  .flt details[open] summary::after{content:"▴"}
  .hint,.smallcall,.phoneblk,.lbl,.lbl2{display:none}
  .card .two{display:block}
  table.rt td.st,table.rt td.ht{display:inline-block;width:auto;margin:4px 8px 0 0;vertical-align:middle}
  .sheet{padding:0 12px calc(20px + env(safe-area-inset-bottom,0px));gap:10px}
  .hd{margin:0 -12px;padding:8px 12px!important;border-bottom:1px solid var(--line);background:var(--card)!important}
  .hd .small{font-size:.7rem}
  .hd button{min-height:40px;padding:4px 14px}
  .callbig{min-height:54px;margin:0;font-size:1.05rem;border-radius:999px}
  .acts{gap:8px}.acts button{min-height:52px;font-size:.95rem}
  table.rt tr{padding:9px 4px}table.rt td.call{right:4px;top:8px}.callbtn{min-width:44px;min-height:44px;font-size:1.15rem}
  .tw:has(table.rt){border:0;background:transparent;overflow:visible}
  .card .tw:has(table.rt){margin:0 -4px}
  .tw{-webkit-overflow-scrolling:touch}
  .two{gap:8px}
  .msg{padding:9px 12px;font-size:.9rem}
  .row{gap:8px}
}
@media (prefers-reduced-motion:no-preference){.sheet{animation:in .2s ease-out}@keyframes in{from{transform:translateX(24px);opacity:.4}}}
[hidden]{display:none!important}
#app{display:flex;flex-direction:column;gap:16px}
body:not(.in) main{max-width:none;padding:0}body:not(.in) #app>.login{margin:12vh auto}

/* statistiques de direction */
.dhero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:22px 24px;border-radius:18px;color:#fff;background:radial-gradient(circle at 92% 8%,#62dd4a55,#62dd4a00 38%),linear-gradient(135deg,#0a2540,#0f5ea8 62%,#2a9fd6);box-shadow:var(--shadow)}
.dhero h2{color:#fff;font-size:1.7rem}.dhero p{margin:4px 0 0;opacity:.85;font-size:.9rem}
.dctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dhero select,.dhero button:not(.chip){background:#ffffff1f;color:#fff;border:1px solid #ffffff44;border-radius:999px;min-height:38px;padding:6px 14px;font-size:.85rem}.dhero select option{color:#10201a}.dhero button.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chips{display:flex;gap:4px;flex-wrap:wrap;background:#ffffff1a;border-radius:999px;padding:3px}
.chip{border:0!important;background:transparent;border-radius:999px!important;min-height:34px!important;padding:4px 12px!important;font-size:.8rem;color:inherit;font-weight:600;box-shadow:none!important}
.dhero .chip{color:#fff}.chip.on{background:var(--accent)!important;color:var(--accent-ink)!important}.card .chips{background:var(--bg)}.card .chip{color:var(--muted)}.card .chip.on{color:var(--accent-ink)}
.kpis{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.kpis>.kpi{grid-column:span 3}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:2px}
.kpi::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--accent),var(--blue))}
.kpis>.kpi.hero{grid-column:span 6;background:linear-gradient(135deg,#eafbe4,#e0f3fb);border-color:#cfe9d6}
.kl{font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kv{font:700 2rem/1.1 var(--hf);color:var(--ink);font-variant-numeric:tabular-nums}.kpi.hero .kv{font-size:2.7rem}
.kd{min-height:20px}.kx{font-size:.78rem;color:var(--muted)}.ks{position:absolute;right:14px;top:30px}.spark{width:110px;height:34px}
.dl{display:inline-block;font-size:.74rem;font-weight:700;padding:1px 8px;border-radius:999px}.dl.up{background:var(--okbg);color:var(--ok)}.dl.down{background:var(--badbg);color:var(--bad)}
.dgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.dgrid>.card{min-width:0}
.chart{width:100%;height:auto;display:block}.chart .grid{stroke:var(--line);stroke-width:1}.chart .ax{fill:var(--muted);font-size:11px}
.leg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.84rem}.leg.inl{flex-direction:row;flex-wrap:wrap;gap:6px 16px;margin-bottom:6px}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.donutw{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.donut{width:150px;height:150px;flex:none}.donut circle{transition:stroke-width .2s}.donut circle:hover{stroke-width:24}.dc1{font:700 26px var(--hf);fill:var(--ink)}.dc2{font-size:10px;fill:var(--muted)}
.fun{display:flex;flex-direction:column;gap:14px;padding-top:6px}.fr{display:grid;grid-template-columns:104px 1fr 128px;gap:10px;align-items:center}.fl{font-size:.82rem;font-weight:600}.ft{background:var(--bg);border-radius:999px;height:38px;overflow:hidden}.ff{height:100%;border-radius:999px;display:flex;align-items:center;justify-content:flex-end;padding-right:12px;min-width:44px;color:#0b1c11;font-size:.85rem;transition:width .6s cubic-bezier(.2,.8,.2,1)}.fp{font-size:.8rem;font-weight:700}.fp span{font-weight:500;color:var(--muted);font-size:.7rem}

    if(m=t.match(/^ville\s*[:\-]?\s*(.+)$/i))set('ville',m[1],t);
    if(m=t.match(/^9\s*H\s*12\s*H\s*\d*\s*[:\-]?\s*(true|false)/i))set('am',m[1].toLowerCase(),t);
    if(m=t.match(/^14\s*H\s*18\s*H\s*\d*\s*[:\-]?\s*(true|false)/i))set('pm',m[1].toLowerCase(),t);
    if(m=t.match(/^budget\s*[:\-]?\s*(.+)$/i))set('budget',m[1],t);
    if(m=t.match(/^campagne\s*[:\-]?\s*(.+)$/i))set('campagne',m[1],t);
    if(m=t.match(/^(?:type de travaux|travaux|projet)\s*[:\-]?\s*(.+)$/i))set('travaux',m[1],t)});
  var dual=/dualsun/i.test(txt);var works=[];
  var travSrc=P.travaux?[P.travaux.v]:clean.filter(function(l){return /\btrue\b/i.test(l)&&!/^\d+\s*H/i.test(l.trim())}).map(function(l){return l.replace(/\s*true/i,'')});
  travSrc.forEach(function(s){S.works.forEach(function(w){var a=norm(w),b=norm(s);if(b.indexOf(a)>-1||(a==='photovoltaique'&&/photovolta|pv\b|panneaux/.test(b)))if(works.indexOf(w)<0)works.push(w)})});
