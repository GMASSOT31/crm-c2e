function parseMail(txt){var P={},al=[],lines=txt.replace(/\r/g,'').split('\n'),masked=false;

    if(m=t.match(/^code\s*postal\s*[:\-]?\s*(\d{5})/i))set('cp',m[1],t);
    if(m=t.match(/^ville\s*[:\-]?\s*(.+)$/i))set('ville',m[1],t);
    if(m=t.match(/^9\s*H\s*12\s*H\s*\d*\s*[:\-]?\s*(true|false)/i))set('am',m[1].toLowerCase(),t);
    if(m=t.match(/^14\s*H\s*18\s*H\s*\d*\s*[:\-]?\s*(true|false)/i))set('pm',m[1].toLowerCase(),t);
    if(m=t.match(/^budget\s*[:\-]?\s*(.+)$/i))set('budget',m[1],t);
    if(m=t.match(/^campagne\s*[:\-]?\s*(.+)$/i))set('campagne',m[1],t);
    if(m=t.match(/^(?:type de travaux|travaux|projet)\s*[:\-]?\s*(.+)$/i))set('travaux',m[1],t)});
  var dual=/dualsun/i.test(txt);var works=[];
  var travSrc=P.travaux?[P.travaux.v]:clean.filter(function(l){return /\btrue\b/i.test(l)&&!/^\d+\s*H/i.test(l.trim())}).map(function(l){return l.replace(/\s*true/i,'')});
  travSrc.forEach(function(s){S.works.forEach(function(w){var a=norm(w),b=norm(s);if(b.indexOf(a)>-1||(a==='photovoltaique'&&/photovolta|pv\b|panneaux/.test(b)))if(works.indexOf(w)<0)works.push(w)})});

  var src=P.form?P.form.v:(dual?'Leads Dualsun':''),srcOk=S.sources.filter(function(s){return norm(s)===norm(src)})[0];

  var all=[],from=0;for(;;){var q=await SB.from('requests').select('*,contacts(*),sources(name),request_work_types(work_types(name))').order('id',{ascending:false}).range(from,from+999);if(q.error)throw q.error;all=all.concat(q.data);if(q.data.length<1000)break;from+=1000}

function showLogin(msg){$('#boot').hidden=true;$('#topbar').hidden=true;$('#modal').innerHTML='';
  $('#app').innerHTML='<form class="login card" id="lf"><h2>CRM C2e</h2><p class="muted" style="margin:0">Application privée. Connectez-vous avec votre compte nominatif.</p>'+(msg?'<div class="msg bad">'+esc(msg)+'</div>':'')+'<label>Email<input id="lem" type="email" autocomplete="username" required></label><label>Mot de passe<input id="lpw" type="password" autocomplete="current-password" required></label><button class="p">Se connecter</button><button type="button" id="lforgot">Mot de passe oublié</button></form>'}
document.addEventListener('submit',async function(e){if(e.target.id==='lf'){e.preventDefault();var r=await SB.auth.signInWithPassword({email:$('#lem').value.trim(),password:$('#lpw').value});if(r.error)showLogin('Email ou mot de passe incorrect.');else start()}});

async function start(){
  var s=await SB.auth.getSession();if(!s.data.session){showLogin();return}
  var um=(s.data.session.user.user_metadata||{});
  if(INVITE||um.must_change_password){$('#boot').hidden=true;$('#app').innerHTML='<form class="login card" id="pf"><h2>Bienvenue sur le CRM C2e</h2><p class="muted" style="margin:0">Choisissez votre mot de passe personnel. Le mot de passe provisoire ne servira plus.</p><label>Mot de passe (12 caractères minimum)<input id="npw" type="password" minlength="12" required autocomplete="new-password"></label><button class="p">Enregistrer</button></form>';return}
  var me=await SB.from('profiles').select('*').eq('id',s.data.session.user.id).maybeSingle();
